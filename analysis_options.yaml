# Static analysis for the app. CI runs `flutter analyze --fatal-infos`, so
# every rule below is a merge gate, not a suggestion.
include:
  - package:flutter_lints/flutter.yaml
  # Bloc rules are checked by `dart run bloc_tools:bloc lint lib`, not by
  # `flutter analyze`; CI runs both.
  - package:bloc_lint/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - .claude/**
    - build/**
    - functions/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  errors:
    # Leaked subscriptions and sinks are real bugs in a stream-heavy app.
    cancel_subscriptions: error
    close_sinks: error
    unawaited_futures: warning
    use_build_context_synchronously: error

linter:
  rules:
    # Correctness
    - avoid_print
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - unawaited_futures
    - discarded_futures
    - use_build_context_synchronously
    - always_declare_return_types
    - avoid_returning_null_for_void
    - only_throw_errors
    - throw_in_finally
    - unnecessary_await_in_return
    - avoid_slow_async_io
    - test_types_in_equals
    - hash_and_equals

    # Performance
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - avoid_unnecessary_containers
    - sized_box_for_whitespace
    - use_colored_box
    - use_decorated_box

    # Naming and style
    - prefer_final_locals
    - prefer_final_fields
    - prefer_single_quotes
    - sort_constructors_first
    - sort_child_properties_last
    - require_trailing_commas
    - directives_ordering
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - use_super_parameters
    - library_private_types_in_public_api
