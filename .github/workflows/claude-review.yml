name: Claude PR review

# Reviews every PR against .github/REVIEW_GUIDELINES.md and posts inline
# comments plus one summary comment. It advises; it does not block merging.
# The CI checks and a human approval are the merge gates.
#
# Setup: add the ANTHROPIC_API_KEY repository secret and install the Claude
# GitHub app on the repo (README, "CI").
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts are skipped until they are marked ready. PRs from forks and from
    # Dependabot are skipped: GitHub does not give either the API key secret,
    # and dependency bumps are covered by CI and dependency review.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read .github/REVIEW_GUIDELINES.md and
            CLAUDE.md (if present) first and apply them: naming, the bloc
            pattern, performance, security and Firestore rules, tests,
            localisation and accessibility.

            Look at the diff with `gh pr diff`, and read the surrounding code
            before commenting so every comment is about the real behaviour.

            - Post each finding as an inline comment on the exact line, with
              its severity (blocker / should-fix / nit), why it matters, and a
              concrete fix.
            - Do not comment on formatting or anything `flutter analyze`,
              `dart format` or bloc lint already enforce; CI covers those.
            - Do not invent problems. If the PR is clean, say so.
            - Finish with one summary comment via `gh pr comment`: a verdict
              (approve / approve with nits / changes requested), the blockers
              first, then what was done well.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
