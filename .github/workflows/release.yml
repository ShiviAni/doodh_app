name: Release

# Builds a signed Play Store bundle when a version tag is pushed:
#   git tag v1.2.0 && git push origin v1.2.0
#
# Needs these repository secrets (README, "CI"):
#   GOOGLE_SERVICES_JSON_BASE64   base64 of android/app/google-services.json
#   ANDROID_KEYSTORE_BASE64       base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Without them the job fails at the first step rather than producing a
# debug-signed build.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    steps:
      - name: Check release secrets are present
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "$GS" ] && [ -n "$KS" ] || { echo "::error::Release secrets are not configured"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true
      - name: Write Firebase config and signing key
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$GS" | base64 --decode > android/app/google-services.json
          echo "$KS" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > android/key.properties
      - run: flutter pub get
      - run: flutter test
      - run: flutter build appbundle --release --obfuscate --split-debug-info=build/symbols
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.ref_name }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/symbols/
          retention-days: 30
      - name: Remove secrets from the runner
        if: always()
        run: rm -f android/key.properties android/app/google-services.json "$RUNNER_TEMP/upload.jks"
