name: doodh_app
description: "Doodh Hisab — daily milk delivery tracking for a small dairy."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.2
  firebase_storage: ^13.0.2
  firebase_messaging: ^16.0.2
  flutter_local_notifications: ^19.4.2

  # State / DI / routing
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  get_it: ^8.2.0
  go_router: ^16.2.4

  # Utilities
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  csv: ^6.0.0
  share_plus: ^11.0.0
  image_picker: ^1.2.0
  speech_to_text: ^7.0.0
  cupertino_icons: ^1.0.8

  # In-memory Firebase doubles. Used by test/ and by lib/main_demo.dart, which
  # runs the whole UI on seeded sample data with no Firebase project. Declared
  # as real dependencies only so the demo entrypoint may live under lib/; Dart
  # tree-shakes from the entrypoint, so a release build of main.dart carries
  # none of this.
  fake_cloud_firestore: ^4.0.0
  firebase_auth_mocks: ^0.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  bloc_lint: ^0.4.1
  bloc_tools: ^0.1.0-dev.25
  patrol: ^4.12.0

flutter:
  uses-material-design: true

# Patrol integration tests live in patrol_test/ and run the demo entrypoint
# (fake Firestore, no Firebase project), so CI needs no secrets.
patrol:
  app_name: Doodh Hisab
  test_directory: patrol_test
  android:
    package_name: com.shivani.doodh_app
